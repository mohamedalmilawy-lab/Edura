<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g transform="translate(75, 75)" filter="url(#softShadow)">
    <!-- Outer ring -->
    <circle cx="125" cy="125" r="120" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.5"/>

    <!-- Left page -->
    <path d="M 125 195
             C 125 195, 70 185, 50 190
             L 50 70
             C 70 65, 125 80, 125 80
             L 125 195 Z" 
          fill="url(#bookGrad)"/>

    <!-- Right page -->
    <path d="M 125 195
             C 125 195, 180 185, 200 190
             L 200 70
             C 180 65, 125 80, 125 80
             L 125 195 Z" 
          fill="#6366f1"/>

    <!-- Spine -->
    <path d="M 125 80 L 125 195" stroke="#3730a3" stroke-width="6" stroke-linecap="round"/>

    <!-- Page lines left -->
    <line x1="68" y1="100" x2="116" y2="100" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="125" x2="116" y2="125" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="150" x2="116" y2="150" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="175" x2="116" y2="175" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Page lines right -->
    <line x1="134" y1="100" x2="182" y2="100" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="134" y1="125" x2="182" y2="125" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="134" y1="150" x2="182" y2="150" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="134" y1="175" x2="182" y2="175" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Glow node -->
    <circle cx="125" cy="38" r="16" fill="url(#accentGrad)" filter="url(#softGlow)"/>
    <circle cx="125" cy="38" r="8" fill="#cffafe"/>

    <!-- Rays -->
    <line x1="125" y1="12" x2="125" y2="-2" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="102" y1="19" x2="91" y2="6" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="148" y1="19" x2="159" y2="6" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="89" y1="38" x2="74" y2="38" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="161" y1="38" x2="176" y2="38" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Connection -->
    <line x1="125" y1="56" x2="125" y2="76" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6 5" opacity="0.5"/>
  </g>
</svg>